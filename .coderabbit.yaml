# CodeRabbit Configuration
# AI 기반 코드 리뷰 설정

# 리뷰 설정
reviews:
  # 리뷰 프로필: "chill" (친절한 톤) 또는 "assertive" (단호한 톤)
  profile: "chill"

  # 높은 수준의 요약 제공
  high_level_summary: true

  # 시(poem) 형태의 요약 비활성화
  poem: false

  # 리뷰 상태 표시
  review_status: true

  # PR 변경 요청 워크플로우
  request_changes_workflow: false

  # 자동 리뷰 활성화
  auto_review:
    enabled: true

  # 시퀀스 다이어그램 생성 (코드 변경사항의 제어 흐름 시각화)
  sequence_diagrams: true

  # 코드 품질 체크
  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true

  # 전체 프로젝트에 적용되는 일반 지침 (회사 코딩 규칙)
  instructions: |
    ## 공통 코딩 규칙
    - 모든 함수와 클래스에 JSDoc 주석 작성
    - TypeScript 타입 안정성 엄격히 준수 (any 사용 금지)
    - console.log 대신 적절한 로깅 라이브러리 사용
    - 에러 처리는 반드시 try-catch로 명시적으로 처리
    - 비즈니스 로직과 UI 로직 분리

    ## 보안 규칙
    - 환경 변수에 민감한 정보 저장 (하드코딩 금지)
    - SQL 쿼리는 반드시 parameterized query 사용
    - 사용자 입력값은 항상 검증 및 sanitize

    ## 성능 최적화
    - 불필요한 re-render 방지 (React.memo, useMemo, useCallback 활용)
    - 이미지는 최적화된 형식 사용 (Next.js Image 컴포넌트)
    - API 호출 시 로딩/에러 상태 처리

  # 경로별 특정 지침
  path_instructions:
    # TypeScript/JavaScript 파일
    - path: "**/*.ts,**/*.tsx,**/*.js,**/*.jsx"
      instructions: |
        - 함수는 단일 책임 원칙(SRP) 준수
        - 매직 넘버 사용 금지 (상수로 정의)
        - 화살표 함수 우선 사용
        - async/await 패턴 사용 (Promise then/catch 지양)

    # React 컴포넌트
    - path: "**/*.tsx,**/*.jsx"
      instructions: |
        - 컴포넌트명은 PascalCase 사용
        - Props는 interface로 명시적 정의
        - 상태 관리는 최소화하고 필요시 상위로 올리기
        - useEffect 의존성 배열 정확히 명시
        - 커스텀 훅은 use- 접두사 사용

    # Next.js 페이지/라우트
    - path: "apps/web/src/app/**/*.tsx"
      instructions: |
        - Server Component vs Client Component 구분 명확히
        - 'use client' 지시어 필요한 곳에만 사용
        - 메타데이터는 generateMetadata 사용
        - 동적 라우트는 generateStaticParams 고려

    # API 라우트
    - path: "apps/web/src/app/api/**/*.ts"
      instructions: |
        - HTTP 메서드별 핸들러 명확히 분리
        - 적절한 HTTP 상태 코드 사용
        - 에러 응답은 일관된 형식 유지
        - Request/Response 타입 명시

    # 유틸리티/헬퍼 함수
    - path: "packages/shared/src/**/*.ts"
      instructions: |
        - 순수 함수로 작성 (사이드 이펙트 없음)
        - 단위 테스트 작성 필수
        - 함수 시그니처 명확히 (입력/출력 타입)
        - 재사용 가능한 범용 함수로 설계

# 채팅 설정
chat:
  # 자동 답변 활성화
  auto_reply: true

# 언어 설정
language: "ko-KR"

# 경로 필터 설정
path_filters:
  # 리뷰에서 제외할 경로
  excluded:
    # 테스트 파일
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"

    # 빌드 출력물
    - "**/dist/**"
    - "**/.next/**"
    - "**/build/**"
    - "**/.turbo/**"

    # Android 빌드 아티팩트
    - "**/apps/appdata/android/.gradle/**"
    - "**/apps/appdata/android/build/**"
    - "**/apps/appdata/android/app/build/**"

    # 의존성 및 캐시
    - "**/node_modules/**"
    - "**/.vercel/**"
    - "**/coverage/**"

    # 기타
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/*.map"
